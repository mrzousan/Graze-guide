function chips(el,items,cur,set){
  el.innerHTML=items.map(([k,l])=>`<button type="button" class="chip" aria-pressed="${k===cur}" data-k="${k}">${l}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;set(b.dataset.k);render()};
}
function render(){
  chips($("#catChips"),[["all","All types"],...Object.entries(CAT)],cat,k=>{cat=k;store("gg-cat",k)});
  chips($("#regionChips"),[["all","All of California"],["norcal","Northern CA"],["socal","Southern CA"]],reg,k=>{reg=k;store("gg-reg",k)});
  chips($("#rateChips"),[["all","Any rating"],["feed","Can feed"],["free","Feed freely"],["mod","Moderation"],["spar","Sparingly"],["bad","Avoid / toxic"],["nyr","Not rated"]],rate,k=>{rate=k});
  const q=$("#q").value.trim().toLowerCase();
  $("#clear").hidden=!q;
  const rows=P.map((p,i)=>({p,i})).filter(({p})=>
    (cat==="all"||p[2]===cat)&&
    (rate==="all"||(rate==="bad"?(p[4]==="avoid"||p[4]==="toxic"):rate==="feed"?FEED.includes(p[4]):p[4]===rate))&&
    (reg==="all"||region(p)==="both"||region(p)===reg)&&
    (!q||p[0].toLowerCase().includes(q)||p[1].toLowerCase().includes(q)));
  rows.sort((a,b)=>a.p[0].localeCompare(b.p[0]));
  $("#count").textContent=`${rows.length} of ${P.length} plants and foods`;
  let last="",letters=[];
  const L=n=>{const c=n[0].toUpperCase();return /[A-Z]/.test(c)?c:"#"};
  $("#list").innerHTML=rows.length?rows.map(({p,i})=>{const l=L(p[0]);let h="";if(l!==last){last=l;letters.push(l);h=`<li class="letter" id="L-${l}" aria-hidden="true">${l}</li>`}
    return h+`<li><button type="button" class="row" data-i="${i}"><span class="t"><span class="n">${esc(p[0])}</span><span class="s"><i>${esc(p[1])}</i> · ${status(p)}</span></span><span class="pill r-${p[4]}">${RATE[p[4]]}</span></button></li>`}).join("")
   :`<li class="empty">Nothing matches "${esc(q)}" yet. Try the scientific name, or check another type or region. If it's not listed, treat it as not rated and don't feed it.</li>`;
  $("#az").hidden=letters.length<5;
  $("#az").innerHTML=letters.map(l=>`<button type="button" data-l="${l}" aria-label="Jump to ${l}">${l}</button>`).join("");
}
$("#az").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const t=document.getElementById("L-"+b.dataset.l);if(t)t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
function srcLink(k){return `<a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a>`}
function showGuide(){
  $("#guideView").innerHTML=`
   <button type="button" class="back" id="gBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>All plants</button>
   <h1 id="gTitle" tabindex="-1">Feeding a Hermann's tortoise</h1>
   <p class="lead">Hermann's and other Mediterranean tortoises do best on a varied, high-fiber diet of weeds and flowers that's low in protein and sugar.</p>
   <h2>What to feed</h2>
   <ul>
     <li>Make weeds and flowers more than 70% of the diet. Good staples include dandelion, cat's ear, plantain, sow thistle and mallow.</li>
     <li>Mix several kinds every day. Variety keeps any one plant's oxalates or thyroid-affecting compounds from building up.</li>
     <li>Use grocery greens such as endive or romaine only when weeds aren't available.</li>
     <li>Let them graze outdoors when you can. It helps digestion and helps prevent obesity.</li>
   </ul>
   <h2>What not to feed</h2>
   <ul>
     <li><strong>Fruit.</strong> Too much sugar, with more phosphorus than calcium. It can cause digestive upset and parasite problems.</li>
     <li><strong>High-protein foods:</strong> cat or dog food, meat, peas and beans. These are linked to kidney failure, bladder stones and shell deformities.</li>
     <li><strong>Iceberg lettuce.</strong> Almost no fiber, vitamins or minerals.</li>
     <li><strong>Anything rated Avoid or Toxic</strong> in this guide.</li>
   </ul>
   <h2>Calcium and supplements</h2>
   <ul>
     <li>Dust food with a phosphorus-free calcium supplement at least twice a week, and more often for young tortoises.</li>
     <li>Supermarket greens need supplementing most. A cuttlefish bone is welcome but shouldn't be the only calcium source.</li>
     <li>Diet works together with UVB light, which Mediterranean tortoises need.</li>
   </ul>
   <h2>Water</h2>
   <ul>
     <li>Keep fresh water in a shallow dish your tortoise can climb into, and change it daily.</li>
     <li>Soak your tortoise in shallow, lukewarm water for about 10 minutes twice a week.</li>
   </ul>
   <h2>Young tortoises</h2>
   <ul>
     <li>Supplement calcium more often than for adults.</li>
     <li>Offer clover only occasionally; it's high in protein.</li>
     <li>Sources disagree on large amounts of dandelion for very young tortoises, so keep it in a mix rather than the whole meal.</li>
   </ul>
   <h2>Picking plants safely</h2>
   <ul>
     <li>Pick only where nothing has been sprayed or fertilized.</li>
     <li>Avoid busy roadsides, where plants can carry lead from exhaust.</li>
     <li>If you can't identify a plant for certain, don't feed it.</li>
   </ul>
   <h2>Sources</h2>
   <ul class="srcs">
     <li>${srcLink("rvc24")}</li><li>${srcLink("rvc")}</li><li>${srcLink("trust")}</li><li>${srcLink("trustlist")}</li><li>${srcLink("clubweb")}</li>
   </ul>
   <p class="disc">General guidance, not veterinary advice. Ask a reptile vet about your own tortoise's needs.</p>`;
  $("#listView").hidden=true;$("#detailView").hidden=true;$("#guideView").hidden=false;window.scrollTo(0,0);
  $("#gTitle").focus({preventScroll:true});
  $("#gBack").onclick=()=>{$("#guideView").hidden=true;$("#listView").hidden=false;$("#openGuide").focus()};
}
$("#openGuide").addEventListener("click",showGuide);
function show(i){
  const p=P[i];
  const src=p[6].map(k=>`<li><a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a></li>`).join("");
  $("#detailView").innerHTML=`
   <button type="button" class="back" id="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>All plants</button>
   <div class="d-head"><h1 id="dTitle" tabindex="-1">${esc(p[0])}</h1><div class="d-sci"><i>${esc(p[1])}</i> · ${CAT[p[2]]}</div></div>
   <div class="verdict r-${p[4]}"><span class="v">${RATE[p[4]]}</span><span>${BLURB[p[4]]}</span></div>
   <dl class="facts">
     ${p[5]?`<dt>Safe parts</dt><dd>${esc(p[5])}</dd>`:""}
     <dt>In California</dt><dd>${esc(p[3])}</dd>
     ${p[4]==="free"||p[4]==="mod"||p[4]==="spar"?`<dt>Before feeding</dt><dd>Pick only where nothing has been sprayed or fertilized</dd>`:""}
   </dl>
   ${p[7]?`<div class="note">${esc(p[7])}</div>`:""}
   <h2>Sources</h2>
   ${src?`<ul class="srcs">${src}</ul>`:`<p class="status">No source rates this plant for tortoises yet.</p>`}
   <p class="status">${status(p)} · Not yet reviewed by a vet</p>
   <p class="disc">General guidance, not veterinary advice. If your tortoise seems unwell or ate something unknown, contact a reptile vet.</p>`;
  $("#listView").hidden=true;$("#guideView").hidden=true;$("#detailView").hidden=false;window.scrollTo(0,0);
  $("#dTitle").focus({preventScroll:true});
  $("#back").onclick=()=>{$("#detailView").hidden=true;$("#listView").hidden=false;const b=document.querySelector(`.row[data-i="${i}"]`);if(b)b.focus()};
}
$("#list").addEventListener("click",e=>{const b=e.target.closest(".row");if(b)show(+b.dataset.i)});
$("#q").addEventListener("input",render);
$("#clear").addEventListener("click",()=>{$("#q").value="";render();$("#q").focus()});
render();
</script>
