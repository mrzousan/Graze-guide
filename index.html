function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function status(p){const n=new Set(p[6].map(k=>ORG[k]||k)).size;return n>=2?"Sourced":n===1?"One source so far":"No source yet"}
function chips(el,items,cur,set){
  el.innerHTML=items.map(([k,l])=>`<button type="button" class="chip" aria-pressed="${k===cur}" data-k="${k}">${l}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;set(b.dataset.k);render()};
}
function render(){
  chips($("#catChips"),[["all","All types"],...Object.entries(CAT)],cat,k=>{cat=k;store("gg-cat",k)});
  chips($("#rateChips"),[["all","Any rating"],["free","Feed freely"],["spar","Sparingly"],["bad","Avoid / toxic"],["nyr","Not rated"]],rate,k=>{rate=k});
  const q=$("#q").value.trim().toLowerCase();
  $("#clear").hidden=!q;
  const rows=P.map((p,i)=>({p,i})).filter(({p})=>
    (cat==="all"||p[2]===cat)&&
    (rate==="all"||(rate==="bad"?(p[4]==="avoid"||p[4]==="toxic"):p[4]===rate))&&
    (!q||p[0].toLowerCase().includes(q)||p[1].toLowerCase().includes(q)));
  rows.sort((a,b)=>a.p[0].localeCompare(b.p[0]));
  $("#count").textContent=`${rows.length} of ${P.length} plants and foods`;
  $("#list").innerHTML=rows.length?rows.map(({p,i})=>`<li><button type="button" class="row" data-i="${i}"><span class="t"><span class="n">${esc(p[0])}</span><span class="s"><i>${esc(p[1])}</i> · ${status(p)}</span></span><span class="pill r-${p[4]}">${RATE[p[4]]}</span></button></li>`).join("")
   :`<li class="empty">Nothing matches "${esc(q)}" yet. Try the scientific name, or check another type. If it's not listed, treat it as not rated and don't feed it.</li>`;
}
function show(i){

  const src=p[6].map(k=>`<li><a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a></li>`).join("");
  $("#detailView").innerHTML=`
   <button type="button" class="back" id="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>All plants</button>
   <div class="d-head"><h1 id="dTitle" tabindex="-1">${esc(p[0])}</h1><div class="d-sci"><i>${esc(p[1])}</i> · ${CAT[p[2]]}</div></div>
   <div class="verdict r-${p[4]}"><span class="v">${RATE[p[4]]}</span><span>${BLURB[p[4]]}</span></div>
   <dl class="facts">
     ${p[5]?`<dt>Safe parts</dt><dd>${esc(p[5])}</dd>`:""}
     <dt>In California</dt><dd>${esc(p[3])}</dd>
     ${p[4]==="free"||p[4]==="spar"?`<dt>Before feeding</dt><dd>Pick only where nothing has been sprayed or fertilized</dd>`:""}
   </dl>
   ${p[7]?`<div class="note">${esc(p[7])}</div>`:""}
   <h2>Sources</h2>
   ${src?`<ul class="srcs">${src}</ul>`:`<p class="status">No source rates this plant for tortoises yet.</p>`}
   <p class="status">${status(p)} · Not yet reviewed by a vet</p>
   <p class="disc">General guidance, not veterinary advice. If your tortoise seems unwell or ate something unknown, contact a reptile vet.</p>`;
  $("#listView").hidden=true;$("#detailView").hidden=false;window.scrollTo(0,0);
  $("#dTitle").focus({preventScroll:true});
  $("#back").onclick=()=>{$("#detailView").hidden=true;$("#listView").hidden=false;const b=document.querySelector(`.row[data-i="${i}"]`);if(b)b.focus()};
}
